name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate SemVer tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be SemVer, for example v1.2.3" >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Build release artifacts
        shell: bash
        run: |
          make release \
            VERSION="$GITHUB_REF_NAME" \
            COMMIT="$(git rev-parse --short HEAD)" \
            BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            UPDATE_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json" \
            RELEASE_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum sshm-* > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            scripts/install-linux.sh \
            scripts/install-macos.sh \
            scripts/install-windows.ps1 \
            --verify-tag \
            --generate-notes \
            --title "SSH Manager TUI $GITHUB_REF_NAME" \
            "${flags[@]}"
